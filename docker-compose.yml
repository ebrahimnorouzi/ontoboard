# ─────────────────────────────────────────────────────────────
# OntoBoard — Docker Compose
#
# If `docker compose up --build` fails with pip/npm timeouts,
# build images individually first:
#
#   docker build --network host -t ontoboard-frontend ./frontend
#   docker build --network host -t ontoboard-backend  ./backend
#   docker build --network host -t ontoboard-collab   ./collab
#   docker build --network host -t ontoboard-worker   ./worker
#   docker compose up -d
# ─────────────────────────────────────────────────────────────

services:
  # ── React + Cytoscape frontend ─────────────────────────────
  frontend:
    image: ontoboard-frontend:latest
    build:
      context: ./frontend
      network: host
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - collab
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_COLLAB_URL=ws://localhost:1234

  # ── FastAPI backend (includes ROBOT + Java) ─────────────────
  backend:
    image: ontoboard-backend:latest
    build:
      context: ./backend
      network: host
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    environment:
      - DATA_DIR=/app/data
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@ontoboard.local}
      - REDIS_URL=redis://redis:6379/0

  # ── Hocuspocus / Yjs collaboration server ───────────────────
  collab:
    image: ontoboard-collab:latest
    build:
      context: ./collab
      network: host
    ports:
      - "1234:1234"
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATA_DIR=/app/data

  # ── Worker: long-running ROBOT jobs via Redis queue ─────────
  worker:
    image: ontoboard-worker:latest
    build:
      context: ./worker
      network: host
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    environment:
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis:6379/0

  # ── Redis: job queue + pub/sub for progress ─────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
