# Publishes a downloadable release when a version tag is pushed.
#
# Why a tag rather than a button: the jar a user downloads has to be the jar that was tested, and
# the only way to guarantee that is to build it from the tagged commit in a clean checkout. A jar
# uploaded by hand from a laptop is a jar nobody can reproduce - and this project has already
# shipped one release (v1.0.0) that never loaded in Protege at all.
#
# That release was unpublished in 1.84.0, after being measured rather than assumed: its jar fails
# OSGi resolution on Protege 5.6.9 for a missing ch.qos.logback.core.joran.sanity, and fails to
# install at all on 5.5.0. The tag stays - it is the first plugin commit - but nobody should be
# able to download a plugin that cannot start. The smoke receipt gate below exists so that this
# cannot happen again.
#
# To publish a version:
#
#     git tag -a v1.75.0 -m "OntoBoard 1.75.0"
#     git push origin v1.75.0
#
# Every tag keeps its own release and its own jar, so older versions stay downloadable. The
# release page lists them all, newest first, and /releases/latest always resolves to the newest.
#
# Each release also carries an unversioned copy of the jar, so that
# /releases/latest/download/ontoboard.jar is a permanent one-click download of the current build -
# which is what the documentation links to. See the step near the bottom for why the versioned name
# cannot serve that purpose.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # The tag and the pom must agree, or the release page offers a jar whose version is not the
      # one on the tin - and the plugin reports its own version from the bundle manifest, so the
      # two would disagree in the one place a user looks to check which build they are running.
      - name: The tag must match the version in pom.xml
        id: version
        working-directory: protege-plugin
        run: |
          pom=$(grep -m1 '^  <version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pom" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME says $tag, pom.xml says $pom."
            exit 1
          fi
          echo "version=$pom" >> "$GITHUB_OUTPUT"
          echo "Releasing $pom"

      # The release title carries the date as well as the version, because the two audiences ask
      # different questions. A semantic version answers "is this newer than what I have"; a date
      # answers "how old is this", which is the question an ODK user asks first - ODK's own
      # artefacts are dated, and so are the OBO releases a project publishes.
      #
      # The tag stays semantic. Renaming 80-odd existing tags to dates would break every download
      # link already written down, and the jar filename carries the version either way.
      #
      # Taken from the tagged commit, not from the clock: re-running this workflow on an old tag
      # must produce the title that release already has, and `date` would quietly give it today's.
      - name: The date this version was tagged
        id: when
        run: |
          echo "date=$(git log -1 --format=%cd --date=short)" >> "$GITHUB_OUTPUT"

      # The same gate the ordinary build applies. A release is the one moment it matters most:
      # versions 1.20.0 to 1.24.0 shipped without ever being loaded in a Protege.
      - name: Require a host smoke receipt for this version
        working-directory: protege-plugin
        run: |
          receipt="tools/smoke-receipt/${{ steps.version.outputs.version }}.txt"
          if [ ! -f "$receipt" ]; then
            echo "::error::No host smoke receipt at protege-plugin/$receipt."
            exit 1
          fi

      - name: Test
        working-directory: protege-plugin
        run: mvn -B clean test

      - name: Package
        working-directory: protege-plugin
        run: mvn -B -DskipTests package

      - name: Check the jar is not truncated
        working-directory: protege-plugin
        run: unzip -t target/ontoboard-*.jar > /dev/null && echo "valid archive"

      # A second copy under a name that never changes, so one URL always fetches the newest jar:
      #
      #     https://github.com/ebrahimnorouzi/ontoboard/releases/latest/download/ontoboard.jar
      #
      # GitHub's /releases/latest/download/<asset> redirect needs the asset NAME to be stable, and
      # ontoboard-1.93.0.jar is not - a documented link would pin whichever version was current the
      # day somebody wrote the sentence, and go on serving it after twenty releases. The versioned
      # jar is still published beside it, because a user reporting a bug has to be able to say
      # which build they ran and to fetch that exact one again.
      #
      # Copied rather than renamed: both names point at the same bytes from the same build, so
      # there is no question of the stable link serving something that was not smoked.
      - name: A stable filename for the latest-download link
        working-directory: protege-plugin
        run: |
          cp "target/ontoboard-${{ steps.version.outputs.version }}.jar" target/ontoboard.jar
          ls -l target/ontoboard.jar

      # The slide deck, built here rather than committed. It was built once and left in build/,
      # which .gitignore excludes - so the builder shipped and the deck did not, and the only copy
      # was on the machine that made it. A generated artefact belongs in the release beside the
      # jar, built from the same commit, for the same reason the jar is not committed either.
      #
      # It needs no running Protege: the three screenshots it crops are tracked under
      # build/shots/, and everything else - the logo, the pattern figure, the counts on the facts
      # slide - it draws or reads from the repository.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the slide deck
        run: |
          pip install -r deck-requirements.txt
          python tools/build-deck.py
          ls -l build/playground-ontoboard.pptx

      # A deck that opens is the only check worth making here: python-pptx will happily write a
      # file that PowerPoint then refuses, and nobody would find out until they presented it.
      - name: The deck must be a valid package with the slides it claims
        run: |
          python - <<'PY'
          from pptx import Presentation
          deck = Presentation("build/playground-ontoboard.pptx")
          slides = len(deck.slides)
          print("slides:", slides)
          if slides < 20:
              raise SystemExit("the deck lost slides: %d, expected at least 20" % slides)
          blank = [i + 1 for i, s in enumerate(deck.slides)
                   if not any(sh.has_text_frame and sh.text_frame.text.strip()
                              for sh in s.shapes)]
          if blank:
              raise SystemExit("slides with no text at all: %s" % blank)
          print("every slide carries text")
          PY

      # The receipt is the release note. It records what was verified in a real Protege, on which
      # hosts, and - as importantly - what was not.
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: OntoBoard ${{ steps.version.outputs.version }} (${{ steps.when.outputs.date }})
          body_path: protege-plugin/tools/smoke-receipt/${{ steps.version.outputs.version }}.txt
          files: |
            protege-plugin/target/ontoboard-${{ steps.version.outputs.version }}.jar
            protege-plugin/target/ontoboard.jar
            build/playground-ontoboard.pptx
          fail_on_unmatched_files: true
