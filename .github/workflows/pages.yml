# Builds docs/ with mkdocs and publishes it to GitHub Pages.
#
# Pages is configured with build_type: workflow, so this is the only thing that publishes the
# site - there is no branch being served behind our backs.
#
# --strict is deliberate. mkdocs treats a link to a file that is not in the site as a warning and
# builds anyway, which is how a documentation site ends up full of 404s that nobody notices
# because the build was green. Nine links in docs/ pointed outside docs_dir before this workflow
# existed; they are absolute URLs now, and --strict is what stops the tenth.
name: pages

on:
  push:
    branches: [main]
    # Only when something that affects the site changes. The test suite takes minutes and has no
    # bearing on whether the documentation builds.
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - '.github/workflows/pages.yml'
      # The pattern pages are generated from these at build time, so a pattern added or reindexed
      # has to rebuild the site. Without this the library on the web would quietly lag the library
      # in the plugin, which is the one thing a published catalogue must not do.
      - 'patterns/**'
      - 'tools/generate-pattern-pages.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a newer commit win rather than queueing behind an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # Needs a requirements file to key the cache on, and the repository had none after the
          # web application's two were removed. Pinning the toolchain is the better answer than
          # dropping the cache: an unpinned theme can change the site's layout on a commit that
          # touched one sentence.
          cache-dependency-path: docs-requirements.txt

      - name: Install mkdocs
        run: pip install -r docs-requirements.txt

      # 159 pattern pages and 159 Turtle copies, from patterns/index.tsv. Generated rather than
      # committed: 159 Markdown files in git would rot the moment somebody edited one by hand, and
      # the index they come from is itself generated and checked by PatternIndexTest.
      - name: Generate the pattern pages
        run: python tools/generate-pattern-pages.py

      # ontoink mounts every graph from DOMContentLoaded and nothing else - no document$
      # subscription, no IntersectionObserver. Material's navigation.instant swaps the body over
      # XHR, so that event never fires again and every pattern page reached by a click shows an
      # empty box until the reader presses reload. It was reported from the live site.
      #
      # A build with both enabled is GREEN and broken, which is the only reason this check exists:
      # nothing else would catch it. If ontoink gains a document$ hook, delete this and the comment
      # in mkdocs.yml together.
      - name: Instant navigation must stay off while ontoink renders the graphs
        run: |
          if grep -qE '^\s*-\s*ontoink\s*$' mkdocs.yml && grep -qE '^\s*-\s*navigation\.instant\s*$' mkdocs.yml; then
            echo "::error::mkdocs.yml enables navigation.instant while ontoink is a plugin."
            echo "ontoink mounts graphs on DOMContentLoaded, which instant navigation never fires"
            echo "again - every pattern page would render an empty graph until a manual reload."
            exit 1
          fi
          echo "navigation.instant is off; ontoink graphs will mount on every page load"

      - name: Build
        # ONTOINK_REASONER=none is not a preference, it is the difference between a 12-second build
        # and a 15-minute one. Measured: with owlready2 importable, ontoink runs a HermiT
        # consistency check per fence - a JVM per page - at about 4.7s each, and 159 of those is
        # most of a quarter hour. owlready2 is an optional extra that `pip install ontoink` does not
        # pull in, so CI would skip it anyway; the variable is set explicitly because relying on a
        # dependency being absent is not a decision anybody made, and the day something pulls it in
        # transitively the build would get fifteen minutes slower for no visible reason.
        #
        # It also switches off inference materialisation, which is right for this page: the graphs
        # are the axioms each pattern asserts, and the pages say so.
        env:
          ONTOINK_REASONER: none
        run: mkdocs build --strict

      # ontoink's fence renderer wraps its whole body in `except Exception` and returns a
      # <div class="ov-error"> carrying the traceback, without raising and without logging. So a
      # bad source path or a pattern.ttl rdflib cannot parse produces a GREEN --strict build with a
      # red traceback box baked into the page - and across 159 generated pages nobody would see it.
      # This is the assertion that makes the feature honest rather than merely green.
      #
      # Matching the opening div, not the bare class name: ov-error is also a CSS class in the
      # stylesheet ontoink inlines into every page, so grepping for the name alone matches all 159
      # pages whether or not anything failed. Measured that mistake before trusting it.
      - name: No fence rendered an error
        run: |
          if grep -rl '<div class="ov-error"' site/patterns > /dev/null 2>&1; then
            echo "::error::ontoink baked a render error into these pages:"
            grep -rl '<div class="ov-error"' site/patterns
            exit 1
          fi
          echo "$(find site/patterns -name index.html | wc -l) pattern pages, none with a render error"

      # Said out loud because it is large and the reason is not obvious: ontoink inlines its own
      # ~650 KB of JS and CSS into every page carrying a graph and offers no way to externalise it,
      # so most of this is 159 copies of the same bundle. GitHub Pages allows 1 GB. If this line
      # ever approaches that, the answer is fewer graph pages, not a smaller bundle.
      - name: How big the site came out
        run: du -sh site && du -sh site/patterns

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
