# The repository's first CI.
#
# Until now 1,062 tests ran on one laptop, by hand, when somebody remembered. Four audit rounds
# found 70 defects in code that passed those tests every time they were run - which is an argument
# for running them without being asked, not against the tests.
#
# The smoke test needs a Protege install, a bundled JRE and a desktop. A Linux runner has none of
# the three, so on Linux host verification stays a local command (protege-plugin/tools/smoke.ps1)
# whose result is committed as a receipt under protege-plugin/tools/smoke-receipt/, and the test
# job checks the receipt exists for the version being built - so a release cannot reach main
# without somebody having run it in a host.
#
# A Windows runner has all three: Protege publishes a Windows download with its JRE, and the
# runner has a desktop session. So since 1.131.0 the Windows jobs below run the unit tests on a
# Windows file system and smoke.ps1 itself, in both supported Protege versions, on every push.
name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 11: the bundle targets the Java 8 API surface deliberately
      # (maven.compiler.release=8, asserted by BundleConfigurationTest), but the build itself and
      # robot-core's dependencies need a newer JDK to compile.
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Test
        working-directory: protege-plugin
        # Not -o. Offline is right locally, where the repository is warm; in CI it would fail on a
        # cold cache and say nothing useful about the code.
        #
        # UNDER A VIRTUAL DISPLAY, because the canvas component cannot be built without one:
        # mxGraphHandler constructs a java.awt.dnd.DragSource, which throws HeadlessException.
        # CanvasGestureInteractionTest skips itself when there is no display, and 1.123.0
        # shipped two regressions it would have caught - a node that snapped back when
        # dragged, and a click that landed nowhere once the board carried a translate. A
        # suite that can only run headless cannot see either, and both reached a user.
        #
        # xvfb-run is preinstalled on ubuntu-latest. -a picks a free display number so two
        # concurrent jobs do not collide.
        run: xvfb-run -a mvn -B clean test

      - name: Package
        working-directory: protege-plugin
        run: mvn -B -DskipTests package

      # A 64 MB jar can be truncated by a copy that reports success, and the symptom is a plugin
      # that silently never appears. Cheap to check, and it has happened here.
      - name: Check the jar is not truncated
        working-directory: protege-plugin
        run: |
          jar=$(ls target/ontoboard-*.jar)
          unzip -t "$jar" > /dev/null
          echo "$jar is a valid archive"

      - name: Require a host smoke receipt for this version
        working-directory: protege-plugin
        run: |
          version=$(grep -m1 '^  <version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          receipt="tools/smoke-receipt/$version.txt"
          if [ ! -f "$receipt" ]; then
            echo "::error::No host smoke receipt at protege-plugin/$receipt."
            echo "Versions 1.20.0 to 1.24.0 shipped without ever being loaded in a Protege."
            echo "Run tools/smoke.ps1 against both supported installs and commit the receipt."
            exit 1
          fi
          echo "Receipt found:"
          cat "$receipt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: protege-plugin/target/surefire-reports/
          if-no-files-found: ignore

  # Windows was where users found what this machine's tests had not - frames piled on top of each
  # other, a build that would not run - and until 1.131.0 nothing here ever ran on it.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Test
        working-directory: protege-plugin
        run: mvn -B clean test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports-windows
          path: protege-plugin/target/surefire-reports/
          if-no-files-found: ignore

  # The receipt's own command, on Protege's own Windows downloads: the jar just built as the only
  # OntoBoard in plugins\, -SelfTest, and the verdict read from protege.log. The log is kept as an
  # artifact - it is this job's receipt.
  smoke-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - protege: '5.6.9'
            url: https://github.com/protegeproject/protege-distribution/releases/download/protege-5.6.9/Protege-5.6.9-win.zip
          - protege: '5.5.0'
            url: https://github.com/protegeproject/protege-distribution/releases/download/v5.5.0/Protege-5.5.0-win.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Package
        working-directory: protege-plugin
        run: mvn -B -DskipTests package

      - name: Install Protege ${{ matrix.protege }} for Windows, with this jar
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'protege.zip'
          $into = Join-Path $env:RUNNER_TEMP 'protege'
          Invoke-WebRequest -Uri '${{ matrix.url }}' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $into
          $install = (Get-ChildItem $into -Recurse -Filter run.bat | Select-Object -First 1).DirectoryName
          $jar = Get-ChildItem protege-plugin/target -Filter 'ontoboard-*.jar'
          Copy-Item $jar.FullName (Join-Path $install 'plugins')
          "PROTEGE_INSTALL=$install" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Protege at $install, with $($jar.Name)"

      - name: Smoke
        shell: pwsh
        working-directory: protege-plugin
        # A runner is slower than a laptop, and the self-test starts a reasoner.
        run: |
          ./tools/smoke.ps1 -Install $env:PROTEGE_INSTALL -SelfTest -Heap 2G -WaitSeconds 300
          exit $LASTEXITCODE

      - name: Keep protege.log
        if: always()
        shell: pwsh
        run: Copy-Item (Join-Path $HOME '.Protege\logs\protege.log') protege-plugin/target/ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protege-log-windows-${{ matrix.protege }}
          path: protege-plugin/target/protege.log
          if-no-files-found: ignore
