# Propose a NEW pattern for the library that ships inside the plugin.
#
# This form used to serve "a problem with a pattern already in the library" too, through a
# required "What is this about?" dropdown - and then required, for a problem report as much as for
# a proposal, the name, the description, the competency questions, the ontology file, the source
# and the licence. A problem report has none of those. Problems now have their own form,
# pattern-problem.yml, which requires a title and a description; the dropdown went with them,
# since a required choice with one option is a click that says nothing.
#
# The file name stays: ?template=pattern-submission.yml is linked from the documentation site, and
# GitHub resolves the template by file name.
#
# The link to the contributing page pointed at ise-fizkarlsruhe.github.io/ontoboard, which is a
# 404 (measured with curl, as is the site root there). The site is published at
# ebrahimnorouzi.github.io/ontoboard, as mkdocs.yml's site_url says.
#
# The label only applies once a label of that name exists in the repository; GitHub does not
# create it. The title prefix identifies these either way.
name: Propose a new pattern for the library
description: Offer an ontology design pattern for the library that ships inside OntoBoard, for everyone who installs it
title: "[pattern] "
labels: ["pattern-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Three things worth knowing before you fill this in:

        **You do not need us to use your pattern.** Put the file in a folder and point
        OntoBoard at it — *OntoBoard → Pattern library… → Your patterns…* — and it appears beside
        the bundled ones immediately, searchable and importable. This form is for getting a
        pattern into the library **everyone** gets.

        **The review is published in advance.** Every check we run is listed in
        [Contributing a pattern](https://ebrahimnorouzi.github.io/ontoboard/contributing-a-pattern/),
        and you can run them yourself with `robot` before submitting. Nothing here is a judgement
        about your modelling style.

        **Found a problem with a pattern that is already in the library?** Use
        [Report a problem with a pattern in the library](https://github.com/ebrahimnorouzi/ontoboard/issues/new?template=pattern-problem.yml)
        instead. It asks for a title and a sentence, not for any of what follows.

  - type: input
    id: name
    attributes:
      label: Pattern name
      description: What a curator should see in the library list.
      placeholder: Sample Preparation
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What is it for?
      description: >
        A sentence or two on what it models. This becomes the description on its page, so write
        it for somebody deciding whether to adopt it.
      placeholder: >
        How a specimen is prepared before a measurement, and by whom - the steps, their order,
        and the agent responsible for each.
    validations:
      required: true

  - type: textarea
    id: competency-questions
    attributes:
      label: Competency questions
      description: >
        One per line. These matter more than they look: the library's search reads them, and they
        are the field phrased in the words somebody will actually search for. A pattern without
        them cannot be found and nobody can tell what it is for.
      placeholder: |
        Which preparation steps produced this specimen?
        Who performed a given preparation step, and in what order?
    validations:
      required: true

  - type: textarea
    id: ontology
    attributes:
      label: The ontology file
      description: >
        Paste the Turtle or RDF/XML, or give a stable URL - a w3id or a tagged release, not a
        branch that will move. If you attach a file instead, say so here.
      render: turtle
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: A worked example
      description: >
        A few individuals that instantiate the pattern's classes and are connected by its
        properties. We check that the example is consistent WITH the pattern, merged - so please
        use the pattern's own IRIs.
      render: turtle
    validations:
      required: false

  - type: input
    id: source
    attributes:
      label: Source to cite
      description: >
        Where the pattern is published, and who published it. If it is yours, say so. Every
        pattern page carries this as a link a reader can follow.
      placeholder: https://ontologydesignpatterns.org/wiki/Submissions:YourPattern
    validations:
      required: true

  - type: input
    id: licence
    attributes:
      label: Licence
      description: >
        The library ships inside the plugin jar, so we can only include a pattern we are allowed
        to redistribute.
      placeholder: CC BY 4.0
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks you have run
      description: >
        Optional, and honest answers help more than complete ones. We run all of these anyway and
        report the results on this issue.
      options:
        - label: "`robot convert` reads it - so the OWL API can parse it, which Protégé needs"
        - label: "`robot validate-profile --profile DL` passes - it is OWL 2 DL"
        - label: "`robot reason --reasoner hermit` finds it consistent, with no unsatisfiable class"
        - label: "The pattern merged with its example is consistent"
        - label: "It is not already in the library under another name"

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: >
        Known limitations, an upstream issue, or a paper to cite.
    validations:
      required: false
