# Written by Maven resource filtering. Do not edit: the values come from pom.xml.
#
# ROBOT is declared once, in the pom, and read from here by OdkScaffold - so the version the
# bundle embeds and the version the generated CI installs cannot drift apart. A second literal
# in Java is exactly the drift this removes.
robot.version=${robot.version}

# Read by the bench runner, so the version it prints in a receipt cannot drift from the jar.
ontoboard.version=${project.version}

# owner/name on GitHub. Read by PatternProblemReport, so the pattern library's "Report a problem
# with this pattern..." opens the issue form of the repository the pom names - the same
# <github.repo> that update.properties' download address and the bundle's Bundle-DocURL are built
# from - rather than a second copy of the address typed into Java.
github.repo=${github.repo}
