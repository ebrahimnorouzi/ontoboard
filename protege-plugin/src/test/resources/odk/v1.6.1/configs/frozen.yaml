id: froz
title: "Frozen modules ontology"
uribase: https://example.org/froz
documentation:
  documentation_system: mkdocs
ci:
  - github_actions
  - gitlab-ci
import_group:
  products:
    - id: measurement
      module_type: custom
      mirror_type: no_mirror
    - id: dataset
      module_type: custom
      mirror_type: no_mirror
    - id: handmade
      module_type: custom
      mirror_from: https://example.org/handmade.owl
    - id: mini
      mirror_from: https://example.org/mini.owl
      module_type: slme
      module_type_slme: BOT
robot_report:
  use_labels: TRUE
  fail_on: ERROR
  custom_profile: TRUE
  report_on:
    - edit
