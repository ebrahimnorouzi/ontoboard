# PURL configuration for http://purl.obolibrary.org/obo/ptt

idspace: PTT
base_url: /obo/ptt

products:
- ptt.owl: https://raw.githubusercontent.com/obophenotype/ptt/main/ptt.owl
- ptt.obo: https://raw.githubusercontent.com/obophenotype/ptt/main/ptt.obo

term_browser: ontobee
example_terms:
- PTT_0000000

entries:

- prefix: /releases/
  replacement: https://raw.githubusercontent.com/obophenotype/ptt/v

- prefix: /tracker/
  replacement: https://github.com/obophenotype/ptt/issues

- prefix: /about/
  replacement: http://www.ontobee.org/ontology/PTT?iri=http://purl.obolibrary.org/obo/

## generic fall-through, serve direct from github by default
- prefix: /
  replacement: https://raw.githubusercontent.com/obophenotype/ptt/main/
