# PURL configuration for http://purl.obolibrary.org/obo/shop

idspace: SHOP
base_url: /obo/shop

products:
- shop.owl: https://raw.githubusercontent.com//noname/master/shop.owl
- shop.obo: https://raw.githubusercontent.com//noname/master/shop.obo

term_browser: ontobee
example_terms:
- SHOP_0000000

entries:

- prefix: /releases/
  replacement: https://raw.githubusercontent.com//noname/v

- prefix: /tracker/
  replacement: https://github.com//noname/issues

- prefix: /about/
  replacement: http://www.ontobee.org/ontology/SHOP?iri=http://purl.obolibrary.org/obo/

## generic fall-through, serve direct from github by default
- prefix: /
  replacement: https://raw.githubusercontent.com//noname/master/

