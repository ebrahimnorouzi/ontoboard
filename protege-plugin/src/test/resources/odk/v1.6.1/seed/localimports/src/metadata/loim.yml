# PURL configuration for http://purl.obolibrary.org/obo/loim

idspace: LOIM
base_url: /obo/loim

products:
- loim.owl: https://raw.githubusercontent.com/example-org/loim/main/loim.owl
- loim.obo: https://raw.githubusercontent.com/example-org/loim/main/loim.obo

term_browser: ontobee
example_terms:
- LOIM_0000000

entries:

- prefix: /releases/
  replacement: https://raw.githubusercontent.com/example-org/loim/v

- prefix: /tracker/
  replacement: https://github.com/example-org/loim/issues

- prefix: /about/
  replacement: http://www.ontobee.org/ontology/LOIM?iri=http://purl.obolibrary.org/obo/

## generic fall-through, serve direct from github by default
- prefix: /
  replacement: https://raw.githubusercontent.com/example-org/loim/main/

