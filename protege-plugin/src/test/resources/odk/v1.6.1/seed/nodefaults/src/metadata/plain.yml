# PURL configuration for http://purl.obolibrary.org/obo/plain

idspace: PLAIN
base_url: /obo/plain

products:
- plain.owl: https://raw.githubusercontent.com//noname/main/plain.owl
- plain.obo: https://raw.githubusercontent.com//noname/main/plain.obo

term_browser: ontobee
example_terms:
- PLAIN_0000000

entries:

- prefix: /releases/
  replacement: https://raw.githubusercontent.com//noname/v

- prefix: /tracker/
  replacement: https://github.com//noname/issues

- prefix: /about/
  replacement: http://www.ontobee.org/ontology/PLAIN?iri=http://purl.obolibrary.org/obo/

## generic fall-through, serve direct from github by default
- prefix: /
  replacement: https://raw.githubusercontent.com//noname/main/

