# ─────────────────────────────────────────────────────────────
# Development Compose — uses pre-built images + mounts source
# for hot-reload. Build images first with:
#
#   ./run.sh build
#
# Then:
#   docker compose -f docker-compose.dev.yml up -d
#
# Or simply:
#   ./run.sh dev
# ─────────────────────────────────────────────────────────────

services:
  frontend:
    image: ontoboard-frontend:latest
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend
      - collab
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_COLLAB_URL=ws://localhost:1234

  backend:
    image: ontoboard-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
    depends_on:
      - redis
    environment:
      - DATA_DIR=/app/data
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@ontoboard.local}
      - REDIS_URL=redis://redis:6379/0

  collab:
    image: ontoboard-collab:latest
    ports:
      - "1234:1234"
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATA_DIR=/app/data

  worker:
    image: ontoboard-worker:latest
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    environment:
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis:6379/0

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
