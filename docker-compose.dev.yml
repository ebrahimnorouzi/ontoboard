# ─────────────────────────────────────────────────────────────
# Development Compose — builds from source with hot-reload
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#
# This mounts source code as volumes so changes are reflected
# immediately without rebuilding images.
# ─────────────────────────────────────────────────────────────

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend
      - collab
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_COLLAB_URL=ws://localhost:1234

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
    environment:
      - DATA_DIR=/app/data
      - DOCKER_HOST=unix:///var/run/docker.sock
      - ODK_IMAGE=obolibrary/odkfull:latest
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@ontoboard.local}
      - REDIS_URL=redis://redis:6379/0

  collab:
    build: ./collab
    ports:
      - "1234:1234"
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATA_DIR=/app/data

  worker:
    build: ./worker
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
    environment:
      - DATA_DIR=/app/data
      - DOCKER_HOST=unix:///var/run/docker.sock
      - ODK_IMAGE=obolibrary/odkfull:latest
      - REDIS_URL=redis://redis:6379/0

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
