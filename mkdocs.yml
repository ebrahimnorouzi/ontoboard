# The documentation site, published to GitHub Pages by .github/workflows/pages.yml.
#
# Material rather than the readthedocs theme the plugin scaffolds into generated projects. That
# is a deliberate difference, not an inconsistency: a generated ODK project's site is modelled on
# what real ODK repositories use, so it fits in beside them. This site is the project's own front
# door and only costs one pip package to make legible.
#
# Build it locally with:
#   pip install mkdocs mkdocs-material
#   mkdocs serve

site_name: OntoBoard
site_description: Run your whole ODK and ROBOT pipeline inside Protégé.
site_url: https://ebrahimnorouzi.github.io/ontoboard/
repo_url: https://github.com/ebrahimnorouzi/ontoboard
repo_name: ebrahimnorouzi/ontoboard
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  # The mark is a board with three terms and their relations on it - an ontology being drawn,
  # which is the whole argument for the plugin. One SVG using currentColor serves the indigo
  # header, the light page and the dark page; see docs/assets/logo.svg for why it is stroked
  # rather than filled. Material links the logo to the site root, so it is also the way home.
  logo: assets/logo.svg
  favicon: assets/favicon.png
  custom_dir: overrides
  features:
    # navigation.instant is DELIBERATELY ABSENT. It swaps the document body over XHR instead of
    # loading a page, and DOMContentLoaded therefore never fires again - while ontoink mounts every
    # graph from exactly that event:
    #
    #     document.addEventListener("DOMContentLoaded", function () {
    #       document.querySelectorAll(".ontoink-container").forEach(function (el) { initGraph(el.id); });
    #     });
    #
    # So every pattern page reached by clicking a link showed an empty box, and the graph appeared
    # only after a manual reload. Reported from the live site, and reproduced in the bundle: it has
    # four DOMContentLoaded listeners, no document$ subscription and no IntersectionObserver.
    #
    # Not worked around from this side. ontoink's public surface is `liveEditor` alone - initGraph
    # is internal - so the only hooks available were re-dispatching a synthetic DOMContentLoaded at
    # the whole document, which re-runs every other listener too and double-mounts as the inlined
    # IIFE re-registers on each swap. Reaching into a third-party bundle's internals to fix its
    # lifecycle is a thing that breaks silently on its next release.
    #
    # Little is lost: each pattern page inlines its own ~650 KB of ontoink, so these pages are
    # ~800 KB whether or not the shell is reused. Correct beats instant.
    #
    # The real fix belongs upstream - ontoink could subscribe to Material's document$ when present,
    # the way docs/assets/landing.js does. If that lands, this comment and the flag can come back.
    - navigation.top
    # A row of top-level sections in the header, and sticky so it stays there while you read.
    # Without these the only way back to another part of the site from half-way down a long
    # reference page is to scroll to the top first - and the pattern pages are long.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    # The toggle matters here: several pages are long reference tables, and a dark default would
    # be the wrong choice for a document people read beside an editor.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/landing.css
  - assets/pattern-finder.css

markdown_extensions:
  - admonition
  # Makes `markdown` on a raw HTML block mean something. The landing page lays its hero,
  # cards and comparison out in <div> elements and writes their contents as Markdown; with
  # this extension absent the attribute is inert and the whole block passes through raw, so
  # the page renders literal '###' and ':material-draw:' text. Measured before believing it:
  # without md_in_html the built index.html had 0 <h3> elements and 9 literal '###'.
  - md_in_html
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  # Material's icon shortcodes, so a button can carry :material-download: rather than a word.
  # Without this configured the shortcode renders as literal text, which is how a download button
  # ends up reading ":material-download: Download".
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  # Renders the ```ontoink fences on the generated pattern pages into interactive graphs at
  # build time. It registers its own custom_fences on pymdownx.superfences in on_config, so
  # nothing has to be declared for it under markdown_extensions.
  #
  # Deliberately with no options set. Its three config keys - report, quality_gate and
  # strict_quality - and its shape, recommend_shapes and shape_drift fence keys all route their
  # findings through logging.getLogger('mkdocs.plugins.ontoink') BY DESIGN so that --strict
  # fails the build on them. Across 159 real-world patterns they would fire, and this site
  # builds with --strict. A fence carrying only `source:` logs nothing.
  - ontoink

nav:
  - Home: index.md
  - Using it:
      - Getting started: getting-started.md
      - Pattern library: patterns/index.md
      - Working with ODK: odk-workflow.md
      - Collaboration: collaboration.md
      - Testing collaboration locally: testing-collaboration-locally.md
  - Honest accounting:
      - Limitations and roadmap: limitations.md
      - What was fixed: fixed.md
      - Feature parity: feature-parity.md
      - Compared with OntoGraf: compared-with-ontograf.md
  - Going deeper:
      - Development: development.md
      # The specs and plans under docs/superpowers/ are the design record. They are published
      # with the site - every link to them still resolves - but they are not in the nav any more.
      # Ten internal planning documents in the sidebar made the site look like a planning archive
      # that happened to contain a plugin, and a reader deciding whether to install OntoBoard has
      # no use for 'Plan: retirement'. limitations.md links the directory for anybody who wants it.
      - Design record: superpowers/specs/2026-08-14-ontoboard-protege-plugin-design.md
